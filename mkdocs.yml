site_name: CueMol3 &mdash; Molecular Visualization Framework
site_description: CueMol3 (tritium) user documentation
site_url: https://cuemol.github.io/cuemol3_docs/
repo_url: https://github.com/CueMol/cuemol2
edit_uri: ""

theme:
  name: material
  logo: assets/images/cuemol3-logo-160px.png
  favicon: assets/favicon.png
  features:
    - navigation.tabs
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.highlight
    - search.suggest
  # Colours are defined in docs/stylesheets/extra.css (see "Colour palette"),
  # derived from the CueMol3 icon. 'custom' tells Material to emit the data
  # attributes without applying a built-in palette.
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: ダークモードに切り替え
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: ライトモードに切り替え

plugins:
  # NOTE: the search plugin must be listed explicitly. Declaring `plugins:`
  # overrides the default plugin set, and omitting it silently disables search
  # (a latent bug in the cuemol2_docs site).
  - search
  - glightbox:
      manual: true
  - i18n:
      fallback_to_default: true
      docs_structure: folder
      languages:
        - locale: ja
          default: true
          name: 日本語
          build: true

        - locale: en
          name: English
          build: true
          nav:
            - Home: index.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.keys
  - pymdownx.superfences
  - pymdownx.tilde
  - toc:
      permalink: true
      toc_depth: 3
      # Unicode-aware slugify: the stock python-markdown slugify strips CJK and
      # turns every Japanese heading into a meaningless '_1' / '_2' anchor.
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}

extra:
  alternate:
    - name: 日本語
      link: /cuemol3_docs/
      lang: ja
    - name: English
      link: /cuemol3_docs/en/
      lang: en

nav:
  - ホーム: index.md
  - はじめに:
      - getting-started/index.md
      - クイックツアー: getting-started/quick-tour.md
  - インストール:
      - install/index.md
      - macOS: install/macos.md
      - Windows: install/windows.md
      - Linux: install/linux.md
      - 外部ツールの設定: install/external-tools.md
  - 画面構成:
      - ui/index.md
      - サイドパネル: ui/side-panels.md
      - プロパティインスペクタ: ui/inspector.md
      - 下部パネル: ui/bottom-panels.md
      - ツールバーとツールパレット: ui/toolbar-tools.md
      - レンダリングウィンドウ: ui/rendering-window.md
      - マウス・トラックパッド操作: ui/mouse-input.md
      - メニュー:
          - menu/index.md
          - File メニュー: menu/file.md
          - Edit メニュー: menu/edit.md
          - Rendering メニュー: menu/rendering.md
          - Scene メニュー: menu/scene.md
          - View メニュー: menu/view.md
          - Tools メニュー: menu/tools.md
          - Window / Help メニュー: menu/window-help.md
  - CueMol2からの変更点:
      - changes/index.md
      - 操作パラダイムの変更: changes/ui-paradigm.md
      - 機能の統合・改名・廃止: changes/features.md
      - 開発状況と未実装機能: changes/status.md
  - チュートリアル: tutorials/index.md
  - リファレンス:
      - reference/index.md
      - 選択式の文法: reference/selection.md
      - 色の記法: reference/color-syntax.md
      - Coloring: reference/coloring.md
      - Scene: reference/scene.md
      - Object:
          - reference/objects/index.md
          - MolCoord (分子): reference/objects/molcoord.md
          - DensityMap (密度マップ): reference/objects/densitymap.md
          - ElePotMap (静電ポテンシャル): reference/objects/elepot.md
          - MolSurfObj (分子表面): reference/objects/molsurf.md
      - Renderer:
          - reference/renderers/index.md
          - 共通プロパティ: reference/renderers/common.md
          - マテリアル: reference/renderers/material.md
          - エッジライン: reference/renderers/edge-lines.md
          - simple (結合線): reference/renderers/simple.md
          - trace (Cα トレース): reference/renderers/trace.md
          - spline (スプライン): reference/renderers/spline.md
          - ballstick (棒球モデル): reference/renderers/ballstick.md
          - cpk (空間充填モデル): reference/renderers/cpk.md
          - anisou (熱振動楕円体): reference/renderers/anisou.md
          - tube (チューブ): reference/renderers/tube.md
          - ribbon (リボン): reference/renderers/ribbon.md
          - cartoon (カートゥーン): reference/renderers/cartoon.md
          - nucl (核酸): reference/renderers/nucl.md
          - atomintr (計測表示): reference/renderers/atomintr.md
          - disorder (ディスオーダー): reference/renderers/disorder.md
          - molsurf (分子表面・計算済み): reference/renderers/molsurf.md
          - dsurface (分子表面・直接計算): reference/renderers/dsurface.md
          - dsurf2 (分子表面・距離場): reference/renderers/dsurf2.md
          - contour (等高線メッシュ): reference/renderers/contour.md
          - isosurf (等値面): reference/renderers/isosurf.md
          - gpu_mapmesh (等高線・GPU): reference/renderers/gpu_mapmesh.md
      - カメラ: reference/camera.md
      - アニメーション:
          - reference/animation/index.md
          - SimpleSpin (スピン): reference/animation/simplespin.md
          - CamMotion (カメラ移動): reference/animation/cammotion.md
          - ShowHide (表示・非表示): reference/animation/showhide.md
          - SlideInOut (スライド): reference/animation/slideinout.md
          - MolAnim (構造変化): reference/animation/molanim.md
      - スタイル: reference/styles.md
      - 設定項目: reference/settings.md
      - キーボードショートカット: reference/shortcuts.md
      - シーンファイル (.qsc): reference/qsc-format.md

extra_css:
  - stylesheets/extra.css
