version: '3'

vars:
  # Prefer the repo-local venv; fall back to a system-wide mkdocs.
  MKDOCS:
    sh: if [ -x .venv/bin/python ]; then echo ".venv/bin/python -m mkdocs"; else echo "mkdocs"; fi
  # Max image size in bytes, per the writing conventions in README.md.
  MAX_IMAGE_BYTES: '307200'
  ADDR: 127.0.0.1:8000

tasks:
  default:
    desc: List the available tasks
    cmds:
      - task --list
    silent: true

  setup:
    desc: Create .venv and install the documentation dependencies
    status:
      - test -x .venv/bin/mkdocs
    cmds:
      - python3 -m venv .venv
      - .venv/bin/pip install -r requirements.txt

  serve:
    desc: Serve the site locally with live reload (ADDR=host:port to override)
    deps: [setup]
    cmds:
      # mkdocs serves under the site_url path, so the site lives at
      # http://{{.ADDR}}/cuemol3_docs/ -- the bare host root only redirects.
      - '{{.MKDOCS}} serve -a {{.ADDR}} --open'

  build:
    desc: Build the site the way CI does (warnings fail the build)
    deps: [setup]
    cmds:
      - '{{.MKDOCS}} build --strict'

  clean:
    desc: Remove build output
    cmds:
      - rm -rf site .cache

  check:
    desc: Run every check (strict build, image sizes, wording)
    cmds:
      - task: build
      - task: check:images
      - task: check:text

  check:images:
    silent: true
    desc: Fail if any image exceeds the size limit or is tracked by Git LFS
    cmds:
      # This repository deliberately does not use Git LFS, so images must stay
      # small enough to live in the repo directly.
      - |
        big=$(find docs/assets/images -type f -size +{{.MAX_IMAGE_BYTES}}c 2>/dev/null || true)
        if [ -n "$big" ]; then
          echo "Images over {{.MAX_IMAGE_BYTES}} bytes:"
          echo "$big" | while read -r f; do
            echo "  $(du -h "$f" | cut -f1)  $f"
          done
          exit 1
        fi
        echo "All images are within the size limit."

  check:text:
    silent: true
    desc: Report wording that the style conventions rule out (informational)
    cmds:
      # Full-width Latin punctuation from the CueMol2 docs, and the Japanese
      # terms that were unified to Renderer / Object / Coloring. Some hits are
      # legitimate (a third-party product's own terminology, or 塗り分ける used
      # as a plain verb), so this only reports.
      - |
        hits=$(grep -rn '[，．]' docs/ --include='*.md' || true)
        if [ -n "$hits" ]; then
          echo "Full-width Latin punctuation (should be 、。):"
          echo "$hits"
        fi
        hits=$(grep -rn '塗り分け方式' docs/ mkdocs.yml --include='*.md' --include='*.yml' || true)
        if [ -n "$hits" ]; then
          echo "塗り分け方式 was unified to Coloring:"
          echo "$hits"
        fi
        hits=$(grep -rn 'レンダラ\|オブジェクト' docs/ --include='*.md' || true)
        if [ -n "$hits" ]; then
          echo "Katakana terms unified to Renderer / Object (check each hit):"
          echo "$hits"
        fi
        echo "Wording check done."

  i18n:status:
    silent: true
    desc: 'List English pages behind their Japanese source (task i18n:status -- -v lists untranslated pages too)'
    cmds:
      # Each English page starts with "<!-- source: ja/<path> @ <hash> -->",
      # the Japanese commit it was translated from. A page is stale when the
      # Japanese file changed after that commit. Informational only.
      - |
        stale=0; ok=0; bad=0
        for en in $(cd docs/en && find . -name '*.md' | sed 's|^\./||' | sort); do
          [ "$en" = "index.md" ] && continue
          marker=$(head -n 1 "docs/en/$en")
          hash=$(echo "$marker" | sed -n 's/^<!-- source: ja\/.* @ \([0-9a-f]*\) -->$/\1/p')
          if [ -z "$hash" ]; then
            echo "NO MARKER  en/$en"; bad=$((bad+1)); continue
          fi
          n=$(git rev-list --count "$hash"..HEAD -- "docs/ja/$en")
          if [ "$n" -gt 0 ]; then
            last=$(git log -1 --format=%cs -- "docs/ja/$en")
            echo "STALE      en/$en  ($n ja commits since $hash, last $last)"
            stale=$((stale+1))
          else
            ok=$((ok+1))
          fi
        done
        total=$(cd docs/ja && find . -name '*.md' | sed 's|^\./||' | while read -r p; do
          [ -f "../en/$p" ] || echo "$p"; done | wc -l | tr -d ' ')
        case "{{.CLI_ARGS}}" in
          *-v*)
            echo; echo "Untranslated:"
            (cd docs/ja && find . -name '*.md' | sed 's|^\./||' | sort | while read -r p; do
              [ -f "../en/$p" ] || echo "  $p"; done) ;;
        esac
        echo
        echo "up to date: $ok, stale: $stale, no marker: $bad, untranslated: $total"

  todo:
    silent: true
    desc: List the outstanding TODO markers in the docs
    cmds:
      - |
        grep -rho 'TODO([a-z]*)' docs/ --include='*.md' | sort | uniq -c | sort -rn
        echo
        grep -rn 'TODO(' docs/ --include='*.md' || true

  images:
    silent: true
    desc: Show the image inventory by directory
    cmds:
      - |
        find docs/assets/images -type d -mindepth 1 | sort | while read -r d; do
          n=$(find "$d" -maxdepth 1 -type f | wc -l | tr -d ' ')
          [ "$n" -gt 0 ] && printf '%-58s %3s files  %s\n' "$d" "$n" "$(du -sh "$d" | cut -f1)"
        done
        echo
        echo "total: $(find docs/assets/images -type f | wc -l | tr -d ' ') files, $(du -sh docs/assets/images | cut -f1)"

  images:import:
    silent: true
    desc: 'Convert a hand-made image to WebP (task images:import -- in.png docs/assets/images/<page>/name.webp)'
    deps: [e2e:setup]
    cmds:
      # Same encoder and quality ladder as the screenshot pipeline, so
      # hand-made figures match the generated ones and stay within the budget.
      - docs-verify/node_modules/.bin/tsx docs-verify/scripts/import-image.ts {{.CLI_ARGS}}

  e2e:setup:
    desc: Install the docs-verify E2E dependencies
    dir: docs-verify
    status:
      - test -d node_modules
    cmds:
      - npm ci

  e2e:
    desc: Run the documentation E2E suite against the real app (docs-verify/README.md)
    deps: [e2e:setup]
    dir: docs-verify
    cmds:
      - npm run doctor
      - npx playwright test

  e2e:offline:
    desc: Run only the network-free E2E specs (harness smoke)
    deps: [e2e:setup]
    dir: docs-verify
    cmds:
      - npm run doctor
      - npx playwright test --grep-invert @net

  e2e:slow:
    desc: Run the E2E suite including slow steps (Umbreon rendering)
    deps: [e2e:setup]
    dir: docs-verify
    cmds:
      - npm run doctor
      - E2E_SLOW=1 npx playwright test

  e2e:shots:
    desc: Capture the documentation screenshots into docs/assets/images
    deps: [e2e:setup]
    dir: docs-verify
    cmds:
      - npm run doctor
      # E2E_SLOW so the raytraced result is captured too.
      - DOCSHOT=1 E2E_SLOW=1 E2E_WINDOW=1280x800 npx playwright test specs/quick-tour.spec.ts specs/basic
      - task: check:images

  e2e:report:
    desc: Open the last Playwright HTML report
    dir: docs-verify
    cmds:
      - npx playwright show-report
